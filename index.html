<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Realm of Man | ph0shp3ne</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #05050d; /* Deep dark tone matching the upper artwork sky */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 900px; /* Adjust this to change how large the art appears on big screens */
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px; /* Subtle softening of the image corners */
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7); /* Deep shadow to separate it from the background */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="realm-of-man.JPG" alt="The Realm of Man">
    </div>

</body>
