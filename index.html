<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Realm of Man | ph0shp3ne</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #05050d; /* Dark background matches the poster sky */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .story-container {
            width: 100%;
            max-width: 800px; /* Limits width on desktop so it reads like a comic page */
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; /* Keeps images stacked seamlessly with no gaps */
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .poster {
            border-radius: 4px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px; /* Creates a clean separation before the story begins */
        }
        .comic-panel {
            /* Ready for future panels to stack smoothly underneath */
        }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- 1. Top Poster Image -->
        <img src="realm-of-man.jpg" alt="The Realm of Man Title Poster" class="poster">
        
        <!-- 2. First Graphic Story Panel -->
        <img src="Sample_Untitled_Artwork.jpg" alt="The Realm of Man - Panel 1" class="comic-panel">
    </div>

</body>
</html>
